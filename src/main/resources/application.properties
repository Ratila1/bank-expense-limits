spring.application.name=bankexpenselimits

spring.threads.virtual.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
    
app.zone=UTC
app.default-limit-usd=1000.00
app.pending-retry-delay=PT1M

rates.provider.base-url=https://api.twelvedata.com
rates.provider.api-key=${TWELVEDATA_API_KEY:}
rates.provider.connect-timeout=2s
rates.provider.read-timeout=3s
rates.provider.max-attempts=3
rates.provider.backoff=300ms

# Без явного профиля работает dev; в Docker и на сервере задаётся SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Logbook: логируем всё, кроме служебных адресов
logbook.predicate.exclude[0].path=/actuator/**
logbook.predicate.exclude[1].path=/swagger-ui/**
logbook.predicate.exclude[2].path=/v3/api-docs/**
# Секреты в логи не попадают
logbook.obfuscate.parameters[0]=apikey
logbook.obfuscate.headers[0]=Authorization
logbook.obfuscate.headers[1]=X-Api-Key
# Logbook пишет на уровне TRACE
logging.level.org.zalando.logbook.Logbook=TRACE

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true