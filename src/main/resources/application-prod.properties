logging.structured.format.console=logstash
logging.level.com.ratnikau.bankexpenselimits=INFO

# В проде Postgres не поднимается из compose.yaml: параметры приходят из переменных окружения
spring.docker.compose.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Тела запросов содержат номера счетов: логируем их только для ошибок (статус 400 и выше)
logbook.format.style=json
logbook.strategy=body-only-if-status-at-least
logbook.minimum-status=400
management.endpoint.health.show-details=never